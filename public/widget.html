<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Run Tracker</title>
<style>
/* Run Tracker: karta v chatu i celá aplikace (stránka Trénink a PWA). Barva = intenzita tréninku, plná = splněno. */
:root {
  color-scheme: light;
  --bg: #f3f3ef; --surface: #ffffff; --raised: #f5f6f2; --ink: #0f1a14; --ink2: #4d5851; --muted: #858e88;
  --line: #e5e7e1; --line2: #cdd2ca; --wash: rgba(15,26,20,.05);
  --primary: #0f1a14; --on-primary: #ffffff; --accent: #1f7a45;
  --easy: #2a9a8b; --long: #3a66d1; --tempo: #d68a06; --speed: #e0464b; --race: #0f1a14; --other: #8f978f;
  --good: #1f7a45; --warn: #d99000; --warn-ink: #855700; --crit: #d23b3b;
  --sat: 0px; --sab: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #0b0f0d; --surface: #141a17; --raised: #1b221e; --ink: #eef2ec; --ink2: #b2bbb4; --muted: #7c867f;
    --line: #243029; --line2: #36423b; --wash: rgba(255,255,255,.05);
    --primary: #c8f031; --on-primary: #0f1a14; --accent: #c8f031;
    --easy: #4fc4b3; --long: #7299f2; --tempo: #f0ae3c; --speed: #ff6b6f; --race: #eef2ec; --other: #7c867f;
    --good: #74d08f; --warn: #f0ae3c; --warn-ink: #f2bb55; --crit: #ff7474;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0f0d; --surface: #141a17; --raised: #1b221e; --ink: #eef2ec; --ink2: #b2bbb4; --muted: #7c867f;
  --line: #243029; --line2: #36423b; --wash: rgba(255,255,255,.05);
  --primary: #c8f031; --on-primary: #0f1a14; --accent: #c8f031;
  --easy: #4fc4b3; --long: #7299f2; --tempo: #f0ae3c; --speed: #ff6b6f; --race: #eef2ec; --other: #7c867f;
  --good: #74d08f; --warn: #f0ae3c; --warn-ink: #f2bb55; --crit: #ff7474;
}
.t-easy { --tone: var(--easy); } .t-long { --tone: var(--long); } .t-tempo { --tone: var(--tempo); }
.t-speed { --tone: var(--speed); } .t-race { --tone: var(--race); } .t-other, .t-rest { --tone: var(--other); }

* { box-sizing: border-box; }
html, body { height: auto; min-height: 0; margin: 0; background: transparent; overflow: hidden; }
body { color: var(--ink); font: 14px/1.45 var(--font-sans, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
#app { position: relative; max-width: 560px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; transition: opacity .15s; }
#app.busy { opacity: .62; pointer-events: none; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, summary:focus-visible, [data-open]:focus-visible, [data-tip]:focus-visible { outline: 2px solid var(--long); outline-offset: 2px; }
.num, .big, table, .zr, svg text { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* aplikace: celá obrazovka, záložky dole */
html.app, html.app body { height: 100%; overflow: auto; background: var(--bg); }
html.app body { overscroll-behavior-y: none; }
html.app #app { max-width: 620px; min-height: 100%; margin: 0 auto; padding: calc(14px + var(--sat)) 16px calc(96px + var(--sab)); border: 0; border-radius: 0; background: var(--bg); overflow: visible; font-size: 15px; }
html.app #app.busy { opacity: 1; }
html.app #app.busy::before { content: ""; position: fixed; top: var(--sat); left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); background-size: 50% 100%; background-repeat: no-repeat; animation: load 1s linear infinite; z-index: 9; }
@keyframes load { from { background-position: -50% 0; } to { background-position: 150% 0; } }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); padding: 6px max(8px, calc(50% - 300px)) calc(6px + var(--sab)); background: color-mix(in srgb, var(--surface) 88%, transparent); border-top: 1px solid var(--line); -webkit-backdrop-filter: saturate(1.6) blur(16px); backdrop-filter: saturate(1.6) blur(16px); }
.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 52px; padding: 6px 0 2px; border: 0; background: none; color: var(--muted); font-size: 11px; font-weight: 600; cursor: pointer; }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-current="true"] { color: var(--ink); }
.tabbar button[aria-current="true"] svg { color: var(--accent); }
html:not([data-theme="dark"]) .tabbar button[aria-current="true"] svg { color: var(--ink); }

/* záhlaví */
.tabs { display: flex; gap: 2px; margin: -4px -4px 14px; padding: 3px; border-radius: 12px; background: var(--wash); }
.tabs button { flex: 1; min-height: 40px; border: 0; border-radius: 9px; background: none; color: var(--ink2); font-weight: 600; cursor: pointer; }
.tabs button[aria-current="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--line); }
.eyebrow { color: var(--muted); font-size: 11.5px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; }
h2 { margin: 2px 0 0; font-size: 22px; line-height: 1.15; letter-spacing: -.02em; font-weight: 750; }
h3 { margin: 22px 0 10px; color: var(--ink2); font-size: 12px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; }
.sub { color: var(--ink2); font-size: 13px; }
.top { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 8px; }
.top .mid { text-align: center; min-width: 0; }
.ib { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); cursor: pointer; transition: transform .12s, border-color .15s; }
.ib svg { width: 20px; height: 20px; }
.ib[disabled] { opacity: .3; cursor: default; }
.ib:active:not([disabled]) { transform: scale(.94); }
.jump { display: flex; justify-content: center; margin-top: 6px; }
.jump button { min-height: 32px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--wash); color: var(--ink); font-size: 12.5px; font-weight: 650; cursor: pointer; }

/* tlačítka */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 1px solid var(--line2); border-radius: 12px; background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 650; line-height: 1.2; text-decoration: none; cursor: pointer; transition: transform .12s, background-color .15s, border-color .15s, filter .15s; }
.btn svg { flex: none; width: 18px; height: 18px; }
.btn:active { transform: scale(.97); }
.btn.primary { border-color: var(--primary); background: var(--primary); color: var(--on-primary); }
.btn.block { width: 100%; min-height: 54px; border-radius: 15px; font-size: 16px; }
.btn.soft { border-color: transparent; background: var(--wash); }
@media (hover: hover) { .btn:hover { border-color: var(--ink2); } .btn.primary:hover { filter: brightness(1.12); } .btn.soft:hover { background: var(--line); } }
.a-main { margin-top: 14px; }
.a-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
.a-pair .btn[aria-expanded="true"] { border-color: var(--ink); }
.a-more { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; margin-top: 8px; }
.a-more button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-height: 60px; padding: 8px 4px; border: 0; border-radius: 12px; background: var(--wash); color: var(--ink); font-size: 12px; font-weight: 650; line-height: 1.2; text-align: center; cursor: pointer; transition: transform .12s, background-color .15s; }
.a-more button:active { transform: scale(.96); }
@media (hover: hover) { .a-more button:hover { background: var(--line); } }
.a-more svg { width: 20px; height: 20px; color: var(--ink2); }
.a-more svg.i-strava { color: #fc4c02; }
.a-more button { position: relative; }
.a-more svg.ext { position: absolute; top: 8px; right: 8px; width: 12px; height: 12px; }
.ext { width: 13px !important; height: 13px !important; opacity: .6; }

/* hlášky */
.note { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding: 10px 12px; border-radius: 12px; background: var(--wash); font-size: 13.5px; }
.note > span { flex: 1; min-width: 0; }
.note.ok { background: color-mix(in srgb, var(--good) 13%, transparent); }
.note.err { background: color-mix(in srgb, var(--crit) 13%, transparent); }
.note.warn { background: color-mix(in srgb, var(--warn) 15%, transparent); }
.note .ic { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: var(--surface); font-size: 12px; font-weight: 800; }
.note.ok .ic { background: var(--good); color: var(--surface); }
.note.warn .ic { background: var(--warn); color: #1a1200; }
.note.err .ic { background: var(--crit); color: #fff; }
.note .btn { min-height: 38px; padding: 0 12px; font-size: 13px; }

/* týden: objem a pás dní */
.vol { margin-top: 14px; padding: 14px 14px 10px; border-radius: 16px; background: var(--raised); }
html.app .vol { background: var(--surface); }
.vol-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.k { color: var(--ink2); font-size: 12px; font-weight: 600; }
.big { font-size: 34px; font-weight: 750; line-height: 1; letter-spacing: -.03em; }
.big small { margin-left: 3px; color: var(--muted); font-size: 15px; font-weight: 600; letter-spacing: 0; }
.vol-side { display: grid; gap: 3px; text-align: right; font-size: 12.5px; color: var(--ink2); }
.vol-side b { color: var(--ink); font-size: 14px; font-weight: 700; }
.prog { height: 4px; margin-top: 12px; border-radius: 2px; background: var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; border-radius: 2px; background: var(--ink); }
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
.sd { display: flex; flex-direction: column; align-items: stretch; gap: 4px; min-width: 0; padding: 0; border: 0; background: none; text-align: center; cursor: pointer; }
.sd .sb { position: relative; display: flex; align-items: flex-end; justify-content: center; height: 56px; }
.sd .sb i { display: block; width: 100%; max-width: 30px; min-height: 6px; border-radius: 6px; }
.sd .sb i.done { background: var(--tone); }
.sd .sb i.plan { background: color-mix(in srgb, var(--tone) 22%, transparent); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--tone) 55%, transparent); }
.sd .sb i.miss { background: color-mix(in srgb, var(--warn) 14%, transparent); box-shadow: inset 0 0 0 1.5px var(--warn); }
.sd .sb i.skip { background: none; box-shadow: inset 0 0 0 1.5px var(--line2); opacity: .7; }
.sd .sb i.rest { height: 3px; min-height: 3px; max-width: 14px; border-radius: 2px; background: var(--line2); }
.sd .sl { color: var(--muted); font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .03em; }
.sd .sn { margin-top: -4px; color: var(--ink2); font-size: 12px; }
.sd.today .sl, .sd.today .sn { color: var(--ink); }
.sd.today .sn { display: inline-block; align-self: center; min-width: 22px; padding: 0 5px; border-radius: 999px; background: var(--ink); color: var(--surface); font-weight: 700; }
div.sd { cursor: default; }

/* hlavní trénink */
.hero { position: relative; margin-top: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); overflow: hidden; }
.hero::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--tone); }
.hero-k { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; background: color-mix(in srgb, var(--tone) 15%, transparent); color: var(--ink); font-size: 12px; font-weight: 650; white-space: nowrap; }
.tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--tone); }
.hero h2 { margin-top: 6px; font-size: 26px; }
.hero-m { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; margin-top: 8px; }
.hero-m .big small { font-size: 14px; }
.hero-m .pc { color: var(--ink2); font-size: 13px; }
.hero-m .pc b { color: var(--ink); font-size: 17px; font-weight: 700; }
.state { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-weight: 650; }
.state .mk { width: 22px; height: 22px; }

/* rozpis jednotky */
.steps { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 2px; }
.steps li { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 6px 0 6px 14px; font-size: 13.5px; }
.steps li::before { content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 4px; border-radius: 2px; background: var(--tone); }
.steps li.t-rest::before { background: var(--line2); }
.steps li b { font-weight: 650; }
.steps .p { color: var(--ink2); font-size: 13px; white-space: nowrap; }

/* seznam dní */
.days { list-style: none; margin: 16px 0 0; padding: 0; }
.day + .day { border-top: 1px solid var(--line); }
.row { position: relative; display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; width: 100%; min-height: 60px; padding: 10px 4px 10px 14px; border: 0; border-radius: 12px; background: none; text-align: left; cursor: pointer; }
.row::before { content: ""; position: absolute; left: 2px; top: 12px; bottom: 12px; width: 4px; border-radius: 2px; background: var(--tone); opacity: .35; }
.row.st-completed::before, .row.st-partial::before { opacity: 1; }
.row.st-skipped::before { opacity: .15; }
div.row { cursor: default; }
.day.rest .row::before { display: none; }
.row[aria-expanded="true"] { background: var(--raised); }
html.app .row[aria-expanded="true"] { background: var(--surface); }
.row .when { color: var(--muted); font-size: 12px; line-height: 1.25; }
.row .when b { display: block; color: var(--ink); font-size: 13px; font-weight: 700; text-transform: capitalize; }
.day.today .when b::after { content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 5px; border-radius: 50%; background: var(--accent); vertical-align: 2px; }
.row .what, .row .t, .row .s { display: block; min-width: 0; }
.row .t { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s { margin-top: 1px; color: var(--ink2); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.st-skipped .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line2); }
.day.rest .t { color: var(--muted); font-weight: 500; }
.row .end { display: flex; align-items: center; gap: 10px; }
.row .km { min-width: 28px; text-align: right; font-weight: 700; font-size: 15px; }
.row .km small { color: var(--muted); font-size: 11px; font-weight: 600; }
.mk { position: relative; flex: none; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line2); color: var(--surface); font-size: 12px; font-weight: 800; }
.mk svg { width: 14px; height: 14px; }
.mk-completed { background: var(--tone, var(--good)); box-shadow: none; }
.mk-partial { background: conic-gradient(var(--tone, var(--good)) 0 50%, transparent 50% 100%); box-shadow: inset 0 0 0 1.5px var(--tone, var(--good)); }
.mk-skipped { box-shadow: none; background: var(--wash); color: var(--muted); }
.mk-miss { box-shadow: inset 0 0 0 1.5px var(--warn); color: var(--warn-ink); }
.mk-now { box-shadow: inset 0 0 0 2px var(--ink); }
.acts { padding: 4px 4px 16px 14px; }
.acts .steps { margin-top: 0; }

/* pocit */
.feel { margin-top: 14px; }
.feel .fk { display: flex; justify-content: space-between; margin-bottom: 6px; color: var(--ink2); font-size: 12px; font-weight: 600; }
.feel .fk span { color: var(--ink); }
.scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.scale button { min-height: 46px; padding: 0; border: 1px solid var(--line2); border-radius: 12px; background: var(--surface); font-size: 16px; font-weight: 700; cursor: pointer; transition: transform .12s, background-color .15s; }
.scale button:active { transform: scale(.95); }
.scale button[aria-pressed="true"] { border-color: var(--primary); background: var(--primary); color: var(--on-primary); }
.daypick { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 10px; }
.daypick button { position: relative; min-height: 48px; padding: 2px 0; border: 1px solid var(--line2); border-radius: 10px; background: var(--surface); font-size: 11.5px; line-height: 1.15; cursor: pointer; }
.daypick button b { display: block; font-size: 13px; text-transform: capitalize; }
.daypick button[disabled] { opacity: .3; cursor: default; }
.daypick button.busy::after { content: ""; position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--tempo); }
.hintline { margin-top: 6px; color: var(--muted); font-size: 12px; }
.back { margin: -4px 0 6px; }
.back button { display: inline-flex; align-items: center; gap: 4px; min-height: 40px; padding: 0 8px 0 0; border: 0; background: none; color: var(--ink2); font-size: 13.5px; font-weight: 650; cursor: pointer; }
.back svg { width: 18px; height: 18px; }

/* dlaždice */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.tiles.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tile { min-width: 0; padding: 12px; border-radius: 14px; background: var(--raised); }
html.app .tile { background: var(--surface); }
.tile .k { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { margin-top: 2px; font-size: 22px; font-weight: 750; line-height: 1.15; letter-spacing: -.02em; }
.tile .v small { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: 0; }
.tile .n { margin-top: 2px; color: var(--ink2); font-size: 12px; }
.tile .n.good { color: var(--good); font-weight: 650; }
.tile .n.warn { color: var(--warn-ink); font-weight: 650; }
.countdown { display: flex; align-items: baseline; gap: 8px; margin-top: 14px; padding: 14px; border-radius: 16px; background: var(--primary); color: var(--on-primary); }
.countdown .big small { color: inherit; opacity: .75; }
.countdown .cd { margin-left: auto; font-size: 13px; font-weight: 600; opacity: .8; text-align: right; }

/* skóre běhu */
.score { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; align-items: center; margin-top: 14px; padding: 14px; border-radius: 16px; background: var(--raised); }
html.app .score { background: var(--surface); }
.ring { position: relative; width: 84px; height: 84px; }
.ring svg { width: 84px; height: 84px; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; letter-spacing: -.03em; }
.ring b small { font-size: 12px; font-weight: 700; color: var(--muted); }
.score .lbl { font-size: 16px; font-weight: 750; }
.score ul { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 13px; }
.score li span { color: var(--ink2); }

/* grafy a tabulky */
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 6px; color: var(--ink2); font-size: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border-radius: 3px; vertical-align: -1px; }
.legend i.dot { border-radius: 50%; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--muted); font-size: 11px; font-family: inherit; }
svg text.strong { fill: var(--ink); font-weight: 700; }
svg .hit { fill: transparent; }
svg .hit[data-open] { cursor: pointer; }
svg :not(.hit) { pointer-events: none; }
svg .hit:hover, svg .hit.on { fill: var(--wash); }
details { margin-top: 12px; font-size: 13px; }
summary { display: flex; align-items: center; min-height: 40px; color: var(--ink2); font-weight: 600; cursor: pointer; }
summary { list-style: none; gap: 10px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: ""; flex: none; width: 7px; height: 7px; margin: 0 4px 3px auto; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); opacity: .55; transition: transform .15s; }
details[open] > summary::after { transform: rotate(-135deg); margin-bottom: -3px; }
table { width: 100%; margin-top: 4px; border-collapse: collapse; font-size: 13px; }
th, td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th { color: var(--muted); font-size: 11.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; }
th:first-child, td:first-child { text-align: left; white-space: normal; }
td small { color: var(--ink2); font-size: 11.5px; }
td .warn-mark { color: var(--warn-ink); font-weight: 700; }
td .ok { color: var(--good); font-size: 15px; font-weight: 800; }
.dev { display: inline-block; min-width: 58px; padding: 2px 7px; border-radius: 999px; font-size: 12px; font-weight: 650; text-align: center; }
.dev.in { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
.dev.off { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn-ink); }
details.issues ul { margin: 6px 0 0; padding-left: 18px; color: var(--ink2); font-size: 13px; }
details.issues li { margin: 4px 0; }
details.issues li b { color: var(--ink); }
table.weeks tr.now td { font-weight: 700; }
.zones { display: grid; gap: 14px; }
.zone .zt { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.zone .zl { display: flex; align-items: center; gap: 8px; font-weight: 650; }
.zone .zl::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--tone); }
.zone .zr { font-size: 15px; font-weight: 700; }
.zone .zr small { color: var(--muted); font-size: 11.5px; font-weight: 600; }
.track { position: relative; height: 10px; margin-top: 6px; border-radius: 5px; background: var(--wash); }
.track i { position: absolute; top: 0; bottom: 0; min-width: 6px; border-radius: 5px; background: var(--tone); }
.track b { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--ink); }
.pred { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pred > div { min-width: 0; padding: 10px 12px; border-radius: 12px; background: var(--raised); }
html.app .pred > div { background: var(--surface); }
.pred .k { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pred .v { font-size: 18px; font-weight: 750; }
.tip { position: absolute; z-index: 5; max-width: 220px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); box-shadow: 0 8px 24px rgba(0,0,0,.18); color: var(--ink); font-size: 12px; pointer-events: none; }
.tip b { display: block; margin-bottom: 2px; }
.tip span { color: var(--ink2); }
.card { margin-top: 12px; padding: 4px 14px; border-radius: 16px; background: var(--raised); }
html.app .card { background: var(--surface); }
.card > summary { min-height: 52px; color: var(--ink); font-size: 14px; }
.card[open] { padding-bottom: 14px; }
.fk2 { margin: 14px 0 6px; color: var(--ink2); font-size: 12px; font-weight: 600; }
.fk2:first-of-type { margin-top: 2px; }
.pick { display: flex; flex-wrap: wrap; gap: 6px; }
.pick button { min-height: 42px; padding: 0 13px; border: 1px solid var(--line2); border-radius: 999px; background: var(--surface); font-size: 13.5px; cursor: pointer; transition: transform .12s; }
.pick button:active { transform: scale(.96); }
.pick button[aria-pressed="true"] { border-color: var(--primary); background: var(--primary); color: var(--on-primary); font-weight: 650; }
details.cond summary { min-height: 44px; font-size: 12.5px; }
.save { margin-top: 14px; }

/* ostatní */
.hints { margin-top: 18px; }
.hints .k { margin-bottom: 8px; color: var(--muted); }
.hints div { display: flex; flex-wrap: wrap; gap: 6px; }
.hints button { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; background: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: transform .12s, border-color .15s; }
.hints button:active { transform: scale(.96); }
@media (hover: hover) { .hints button:hover { border-color: var(--ink2); } }
ol.howto { margin: 12px 0 0; padding-left: 20px; color: var(--ink2); }
ol.howto li { margin-bottom: 6px; }
ol.fit { color: var(--ink); font-size: 13px; }
.foot { margin-top: 8px; color: var(--muted); font-size: 12px; }
.empty { color: var(--ink2); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<div id="app"><p class="empty">Načítám…</p></div>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');

  var ownResult = false;  // výsledek volání, ke kterému karta patří, už přišel

  var openId = null;      // rozbalená jednotka v týdnu

  var errorText = '';     // chyba poslední akce

  var busy = false;
  var widgetChange = null; // popis změny z widgetu pro model
  var keepOpen = null;    // jednotka, která po akci zůstane rozbalená (pocit po Doběhnuto)
  var backDate = null;    // hodnocení otevřené z týdne: kam vede „← Týden“
  var watchTimer = null;  // karta čeká na změnu, kterou dělá model
  var jumpTo = null;      // po vykreslení posunout na tuto jednotku
  var shownKey = '';      // pohled, který je na obrazovce (v aplikaci se při změně posune nahoru)
  var STALE_MS = 5 * 60 * 1000;

  function showResult(result, fromHost) {

    var key = d ? JSON.stringify(d) : '';

      var what = widgetChange === true ? d.banner.text : widgetChange;
      request('ui/update-model-context', { content: [{ type: 'text', text: 'Uživatel ve widgetu Run Trackeru: ' + what + ' Než budeš radit, načti aktuální stav přes get_plan.' }] }, 10000).catch(noop);
    }

    moveId = null;

  // Karta znovu otevřená po čase (nebo z jiného dne) ukazuje starý stav: potichu si načte aktuální.
  function localToday() { var t = new Date(); return t.getFullYear() + '-' + ('0' + (t.getMonth() + 1)).slice(-2) + '-' + ('0' + t.getDate()).slice(-2); }
  function isStale(d) {

  }
  function viewArgs(d, extra) {
    var a = Object.assign({ fromCard: true }, extra || {});

    if (d && d.view === 'paces' && d.workout && d.workout.id) a.workoutId = d.workout.id;
    return a;
  }

      var keep = data;
      request('tools/call', { name: 'show_result', arguments: { workoutId: keep.workout.id, fromCard: true } }, 15000).then(function (r) {
        var d = r && r.structuredContent;

        data = Object.assign({}, keep, { checkin: d.checkin, workout: Object.assign({}, keep.workout, { status: d.checkin.status }) });
        form = null; render();
      }).catch(noop);
      return;
    }
    var tool = TAB_TOOL[data.view];
    if (!tool) return;
    request('tools/call', { name: tool, arguments: viewArgs(data, withBanner ? { watch: true } : null) }, 15000).then(function (r) {
      if (r && r.structuredContent && r.structuredContent.view) showResult(r);
    }).catch(noop);
  }

  function watchChanges() {
    stopWatch();
    if (!data || data.view !== 'week' || mode === 'pwa') return;
    var startRev = data.rev, tries = 0, args = viewArgs(data, { watch: true });
    (function tick() {
      request('tools/call', { name: 'show_week', arguments: args }, 15000).then(function (r) {
        var d = r && r.structuredContent;
        if (watchTimer !== null && d && d.view === 'week' && (d.banner || d.rev !== startRev)) { stopWatch(); showResult(r); }
      }).catch(noop);

  // ---------- Formátování ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function num(n, d) { return (d == null ? String(n) : n.toFixed(d)).replace('.', ','); }
  function kmRange(a, b) { return a === b ? num(a) : num(a) + '–' + num(b); }
  function pace(sec) { var s = Math.round(sec); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  function dur(sec) {

  }

  function markOf(w, past, now) {
    var k = w.status === 'scheduled' && past ? 'miss' : w.status;
    var inner = k === 'completed' ? icon('check') : k === 'skipped' ? '–' : k === 'miss' ? '?' : '';

  // Řádek rozpisu („Rozklus: 15 min volně (5:04–5:36/km)“): popis vlevo, tempo vpravo, barva podle intenzity.
  function lineTone(s) { return /tempo na (5|10) km|rovinky/.test(s) ? 'speed' : /půlmaraton|maratonsk|svižně/.test(s) ? 'tempo' : /chůze|mezi úseky|pauz|klus mezi/.test(s) ? 'rest' : 'easy'; }
  function steps(lines) {
    return '<ol class="steps">' + lines.map(function (l) {
      var m = l.match(/^(.*?)\s*\((\d+:\d\d)–(\d+:\d\d)\/km\)\s*$/), text = m ? m[1] : l, p = m ? m[2] + '–' + m[3] : '';

      return '<li class="t-' + lineTone(text) + '"><span>' + (lbl ? '<b>' + esc(lbl[1]) + '</b> ' + esc(text.slice(lbl[0].length)) : esc(text)) + '</span>' + (p ? '<span class="p num">' + p + '</span>' : '') + '</li>';

  }
  // Klíčové tempo jednotky: nejrychlejší pásmo v rozpisu.
  function keyPace(lines) {
    var best = null;
    lines.forEach(function (l) {
      var m = l.match(/\((\d+):(\d\d)–(\d+):(\d\d)\/km\)/);
      if (m) { var s = Number(m[1]) * 60 + Number(m[2]); if (!best || s < best.s) best = { s: s, t: m[1] + ':' + m[2] + '–' + m[3] + ':' + m[4] }; }
    });
    return best && best.t;
  }

  // ---------- Tooltip ----------
  var tips = [], tipEl = null;
  function tipAttr(html) { tips.push(html); return ' data-tip="' + (tips.length - 1) + '" tabindex="0"'; }
  function showTip(target) {

    var html = tips[Number(target.getAttribute('data-tip'))];

  }
  function hideTip() {
    if (tipEl) { tipEl.remove(); tipEl = null; }

  // ---------- Ovládání ----------

    // Sloupce grafu nejsou tlačítka; Enter a mezerník je otevřou stejně jako klepnutí.

  });

    var el = e.target.closest ? e.target : null;

    var fe = el.closest('[data-feel]');
    if (fe) { saveFeel(fe); return; }
    var dn = el.closest('[data-done]');
    if (dn) { markDone(dn); return; }
    var o = el.closest('[data-open]');
    if (o) { if (!o.disabled) trigger(o); return; }
    var link = el.closest('[data-link]');
    if (link) {
      // V izolovaném rámu nemusí jít otevřít nové okno; hostitel to umí na požádání.
      e.preventDefault();
      if (oai && typeof oai.openExternal === 'function') { try { oai.openExternal({ href: link.getAttribute('href') }); return; } catch (err) { /* zkusí se standardní cesta */ } }
      request('ui/open-link', { url: link.getAttribute('href') }, 10000).then(function (r) { if (r && r.isError) throw new Error('rejected'); }).catch(function () { window.open(link.getAttribute('href'), '_blank', 'noopener'); });
      return;
    }
    var mv = el.closest('[data-move]');
    if (mv) { moveId = moveId === mv.getAttribute('data-move') ? null : mv.getAttribute('data-move'); render(); return; }
    var pick = el.closest('[data-pick]');
    if (pick && form) {
      var key = pick.getAttribute('data-pick'), val = pick.getAttribute('data-val');
      if (key === 'cond') { var at = form.conditions.indexOf(val); if (at < 0) form.conditions.push(val); else form.conditions.splice(at, 1); }
      else if (key === 'feel') form.feel = form.feel === Number(val) ? null : Number(val);
      else if (key === 'pain') form.pain = val;
      else form.status = val;
      render(); return;
    }
    if (el.closest('[data-save]') && form && data && data.view === 'result') { saveCheckin(data); return; }
    var hero = el.closest('[data-hero]');
    if (hero) { var hb = document.getElementById('hero'); if (hb) hb.scrollIntoView({ block: 'start', behavior: 'smooth' }); return; }
    var jump = el.closest('[data-jump]');
    if (jump) {
      var id = jump.getAttribute('data-jump');
      if (data && data.view === 'week' && heroOf(data) && heroOf(data).w.id === id) { var hh = document.getElementById('hero'); if (hh) hh.scrollIntoView({ block: 'start', behavior: 'smooth' }); return; }
      openId = id; moveId = null; jumpTo = id; render(); return;
    }
    var row = el.closest('[data-row]');
    if (row) { openId = openId === row.getAttribute('data-row') ? null : row.getAttribute('data-row'); moveId = null; render(); }
  });

  // ---------- Společné části ----------
  var CARD_VIEWS = { show_week: 1, show_plan: 1, show_paces: 1, show_result: 1 };
  function opener(label, name, args, fallback, extra) {
    if (CARD_VIEWS[name]) args = Object.assign({}, args, { fromCard: true });
    return '<button type="button" data-open="' + name + '" data-args="' + esc(JSON.stringify(args || {})) + '" data-fallback="' + esc(fallback) + '"' + (extra || '') + '>' + label + '</button>';
  }
  // Věta pro Clauda: v chatu se pošle do konverzace, v PWA otevře nový chat (proto ikona ven).
  function sayBtn(label, text, extra) { return '<button type="button" data-say="' + esc(text) + '"' + (extra || '') + '>' + label + (mode === 'pwa' ? icon('out', 'ext') : '') + '</button>'; }
  var TABS = [['week', 'Týden', 'show_week', 'Ukaž mi tento týden.', 'cal'], ['plan', 'Plán', 'show_plan', 'Ukaž mi celý plán.', 'bars'], ['paces', 'Tempa', 'show_paces', 'Ukaž mi moje tempa.', 'gauge']];
  function tabOf(d) { return !d ? null : d.view === 'week' || d.view === 'finished' || d.view === 'empty' ? 'week' : d.view === 'plan' ? 'plan' : d.view === 'paces' ? 'paces' : null; }
  function tabBar() {
    var cur = tabOf(data);
    return '<nav class="tabbar" aria-label="Pohledy">' + TABS.map(function (x) { return opener(icon(x[4]) + x[1], x[2], {}, x[3], cur === x[0] ? ' aria-current="true"' : ''); }).join('')
      + '<button type="button" data-say="">' + icon('chat') + (mode === 'pwa' ? 'Claude' : 'Trenér') + '</button></nav>';
  }
  function head(current, d) {
    var h = current === null || inApp ? '' : '<div class="tabs" role="navigation" aria-label="Pohledy">' + TABS.map(function (x) { return opener(x[1], x[2], {}, x[3], current === x[0] ? ' aria-current="true"' : ''); }).join('') + '</div>';
    if (errorText) h += '<div class="note err" role="alert"><span class="ic" aria-hidden="true">!</span><span>' + esc(errorText) + '</span></div>';
    if (sayText) h += '<div class="note" role="status"><span>Napiš do konverzace: „' + esc(sayText) + '“</span></div>';
    if (d && d.banner) h += '<div class="note ok" role="status"><span class="ic" aria-hidden="true">' + icon('check') + '</span><span>' + esc(d.banner.text) + '</span>' + (d.banner.revisionId ? opener('Vrátit', 'undo_change', { revisionId: d.banner.revisionId }, 'Vrať poslední změnu.', ' class="btn"') : '') + '</div>';
    return h;
  }
  // Krátký štítek, celá věta se pošle Claudovi až po klepnutí.
  function hints(list) {
    return '<div class="hints"><div class="k">Zeptat se</div><div>' + list.map(function (t) { return sayBtn(esc(t[0]), t[1], ' title="' + esc(t[1]) + '"'); }).join('') + '</div></div>';
  }
  function tile(k, v, n, ncls) { return '<div class="tile"><div class="k">' + k + '</div><div class="v num">' + v + '</div>' + (n ? '<div class="n' + (ncls ? ' ' + ncls : '') + '">' + n + '</div>' : '') + '</div>'; }

  // ---------- Plán dokončen ----------
  function renderFinished(d) {
    var p = d.plan, h = head('week', d) + '<div class="eyebrow">Plán dokončen</div><h2>' + esc(p.name) + '</h2>';
    h += '<div class="sub">' + dm(p.first) + ' – ' + dm(p.last) + '</div><div class="tiles three">';
    h += tile('Běhy', p.done + ' <small>z ' + p.runs + '</small>', [p.partial ? p.partial + ' částečně' : '', p.skipped ? p.skipped + ' vynecháno' : ''].filter(Boolean).join(', '));
    h += tile('Km', p.doneKm + ' <small>z ' + p.plannedKm + '</small>');
    h += tile('Pocit', p.avgFeel != null ? num(p.avgFeel) + ' <small>/ 5</small>' : '–', p.painCount ? 'bolest ' + p.painCount + '×' : '', 'warn') + '</div>';
    if (p.conditions.length) h += '<p class="sub">Nejčastější okolnosti: ' + esc(p.conditions.join(', ')) + '</p>';
    if (d.earlier.length) {
      h += '<h3>Předchozí plány</h3><table><thead><tr><th>Plán</th><th>Běhy</th><th>Km</th></tr></thead><tbody>';
      d.earlier.forEach(function (x) { h += '<tr><td>' + esc(x.name) + ' <span class="sub">' + dm(x.first) + ' – ' + dm(x.last) + '</span></td><td>' + x.done + '/' + x.runs + '</td><td>' + x.doneKm + '</td></tr>'; });
      h += '</tbody></table>';
    }
    return h + hints([['Další plán', strava ? 'Postav mi další plán podle mé Stravy a toho, co o mně víš.' : 'Postav mi další plán podle toho, co o mně víš. Řeknu ti, kolik teď běhám.'], ['Nahrát plán', 'Mám nový plán v dokumentu, přiložím ho.'], ['Volnější týdny', 'Navrhni mi dva volnější týdny na odpočinek.']]);
  }

  // Forma: odhady z hodnocených běhů a předpověď na cílovou vzdálenost.
  function fitnessBlock(f, width) {
    var dist = num(Math.round(f.distanceM / 100) / 10) + ' km';
    var h = '<h3>Forma</h3><div class="tiles">' + tile('Odhad na ' + dist, dur(f.predictedSec), 'z hodnocených běhů');
    if (f.targetSec) { var gap = f.predictedSec - f.targetSec; h += tile('Cíl', dur(f.targetSec), Math.abs(gap) < 5 ? 'na cíli' : (gap > 0 ? 'chybí ' : 'rezerva ') + dur(Math.abs(gap)), gap > 0 ? 'warn' : 'good'); }
    h += '</div>';
    if (f.points.length > 1) {
      var W = Math.max(260, Math.min(width || 320, 640)), H = 64, L = 6, R = 6, T = 8, B = 8;
      var lo = Math.min.apply(null, f.points.map(function (p) { return p.vdot; })) - 0.5, hi = Math.max.apply(null, f.points.map(function (p) { return p.vdot; })) + 0.5;
      var x = function (i) { return L + (W - L - R) * (f.points.length === 1 ? 0.5 : i / (f.points.length - 1)); };
      var y = function (v) { return T + (H - T - B) * (1 - (v - lo) / (hi - lo)); };
      var path = f.points.map(function (p, i) { return (i ? 'L' : 'M') + x(i) + ' ' + y(p.vdot); }).join('');
      h += '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Vývoj odhadu formy" style="margin-top:10px"><path d="' + path + '" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>' + f.points.map(function (p, i) { return '<circle cx="' + x(i) + '" cy="' + y(p.vdot) + '" r="3.5" fill="var(--ink)"/>'; }).join('') + '</svg>';
    }
    return h;
  }

  // ---------- Kontrola importu ----------
  function renderImport(d) {
    var h = head(null, d) + '<div class="eyebrow">Kontrola importu</div><h2>' + esc(d.name) + '</h2>';
    h += '<div class="sub">' + d.weeks.length + ' ' + plural(d.weeks.length, 'týden', 'týdny', 'týdnů') + (d.missing.length ? ' · chybí ' + d.missing.join(', ') : '') + '</div>';
    h += '<div class="tiles">' + tile('Varování', d.warnings) + tile('Tempa z plánu', d.hasPaces ? 'ano' : 'ne') + '</div>';
    h += '<table class="weeks"><thead><tr><th>Týden</th><th>Km</th><th>Autor</th><th></th></tr></thead><tbody>';
    d.weeks.forEach(function (w) {
      var mark = w.totals === 'off' ? '<span class="warn-mark" title="součet nesedí s dokumentem">⚠</span>' : w.issues.length ? '<span class="warn-mark" title="varování">⚠ ' + w.issues.length + '</span>' : '<span class="ok" title="bez varování">✓</span>';
      h += '<tr><td>' + w.index + (w.phase ? ' <small>' + esc(w.phase) + '</small>' : '') + '</td><td>' + (Math.round(w.kmMax) === Math.round(w.kmMin) ? Math.round(w.kmMin) : Math.round(w.kmMin) + '–' + Math.round(w.kmMax)) + '</td><td>' + (w.declaredKm == null ? '–' : num(w.declaredKm)) + '</td><td>' + mark + '</td></tr>';
    });
    h += '</tbody></table>';
    var issues = [];
    d.paceIssues.forEach(function (t) { issues.push('<li><b>Tempa</b> ' + esc(t) + '</li>'); });
    d.weeks.forEach(function (w) {
      if (w.totals === 'off') issues.push('<li><b>T' + w.index + '</b> Součet ' + Math.round(w.kmMin) + (w.kmMax !== w.kmMin ? '–' + Math.round(w.kmMax) : '') + ' km, autor uvádí ' + num(w.declaredKm) + ' km.</li>');
      w.issues.forEach(function (x) { issues.push('<li><b>T' + w.index + ' ' + esc(x.day) + '</b> ' + esc(x.title) + ': ' + esc(x.text) + '</li>'); });
    });
    if (issues.length) h += '<details class="issues"' + (issues.length <= 4 ? ' open' : '') + '><summary>Varování (' + issues.length + ')</summary><ul>' + issues.join('') + '</ul></details>';
    h += '<div class="a-pair" style="margin-top:14px">';
    if (!d.missing.length) h += sayBtn('Zařadit do kalendáře', 'Zařaď importovaný plán do kalendáře. Varování nech být. Když nevíš začátek nebo datum závodu, zeptej se mě.', ' class="btn primary"');
    if (issues.length) h += sayBtn('Projít varování', 'Projdi se mnou varování z kontroly importu a oprav podle dokumentu to, co potvrdím.', ' class="btn"');
    return h + '</div>';
  }

  // ---------- Bez plánu ----------
  function renderEmpty(d) {
    var h = head('', d) + '<div class="eyebrow">Run Tracker</div><h2>Zatím tu není žádný plán</h2>';
    if (d.staged) h += '<p class="sub">Rozpracovaný import „' + esc(d.staged.name) + '“ má nahrané týdny ' + d.staged.weeks.join(', ') + '. Ještě není zařazený do kalendáře.</p>';
    h += '<ol class="howto"><li>Přilož Claudovi plán v PDF, obrázku nebo tabulce, nebo si nech plán postavit' + (strava ? ' podle své Stravy' : '') + '.</li><li>Napiš, kdy začínáš nebo kdy máš závod.</li><li>Claude plán přepíše, zkontroluje týdenní součty a zařadí ho do kalendáře.</li></ol>';
    return h + hints(d.staged ? [['Dokončit import', 'Dokonči import plánu a zařaď ho do kalendáře.']] : [['Nahrát plán', 'Chci založit plán z dokumentu. Přiložím ho a řeknu ti, kdy mám závod.'], [strava ? 'Plán podle Stravy' : 'Postavit plán', strava ? 'Postav mi plán podle mé Stravy.' : 'Postav mi plán. Řeknu ti, kolik teď běhám.']]);
  }

  // ---------- Týden ----------
  function dayPicker(w) {
    var h = '<div class="daypick" role="group" aria-label="Přesunout na den">';
    data.days.forEach(function (day) {
      var other = day.workouts.filter(function (x) { return x.id !== w.id && x.type !== 'rest' && x.status !== 'skipped'; })[0];
      var off = day.date === w.date || day.date < data.today || (other && other.status !== 'scheduled');
      var fallback = 'Přesuň jednotku ' + w.title + ' (' + when(w) + ') na ' + DOW[day.dow] + ' ' + dm(day.date) + (other ? ' a prohoď ji s ' + other.title : '') + '.';
      h += opener('<b>' + DOW[day.dow] + '</b>' + dm(day.date), 'move_workout', { workoutId: w.id, toDate: day.date, swap: true, reason: 'přesun ve widgetu' }, fallback,
        (off ? ' disabled' : '') + (other ? ' class="busy"' : '') + ' aria-label="' + esc(DOW[day.dow] + ' ' + dm(day.date) + (other ? ', prohodit s ' + other.title : '')) + '"');
    });
    return h + '</div><div class="hintline">Den s tečkou už má trénink; ten se prohodí. Jiný týden napiš Claudovi.</div>';
  }
  // Akce jednotky: v hlavní kartě (hero) i v rozbaleném řádku stejné, jen bez opakování rozpisu.
  function actions(w, inHero) {
    var name = w.title + ' (' + when(w) + ')', h = '', pair = [], more = [], main = '';
    var today = data && data.today, future = today && w.date > today, past = today && w.date < today;
    var review = appHost ? opener(icon('strava') + 'Hodnocení', 'strava_evaluate', evalArgs(w), 'Zhodnoť můj běh z ' + dm(w.date) + '.') : sayBtn(icon('strava') + 'Hodnocení', strava
      ? 'Najdi ve Stravě můj běh z ' + dm(w.date) + ' a zhodnoť ho proti jednotce ' + name + '.'
      : 'Chci zhodnotit běh z ' + dm(w.date) + ' proti jednotce ' + name + '. Zeptej se mě na vzdálenost a čas, nebo ti nahraju export GPX.');
    if (!inHero && w.lines.length) h += steps(w.lines);
    if (w.status === 'scheduled') {
      // Doběhnuto až v den tréninku: zapíše se hned, hodnocení podle Stravy je volitelné potom.

      pair.push('<button type="button" class="btn" data-move="' + w.id + '" aria-expanded="' + (moveId === w.id) + '">' + icon('move') + 'Přesunout</button>');
      pair.push(opener(icon('skip') + 'Vynechat', 'skip_workout', { workoutId: w.id, reason: 'vynecháno ve widgetu' }, 'Vynech jednotku ' + name + '.', ' class="btn"'));
      if (!past && isRun(w)) {
        more.push(sayBtn(icon('short') + 'Zkrátit', 'Jednotku ' + name + ' potřebuju zkrátit. Navrhni úpravu.'));
        more.push(opener(icon('gauge') + 'Tempa', 'show_paces', { workoutId: w.id }, 'Ukaž mi tempa pro jednotku ' + name + '.'));
        more.push(opener(icon('watch') + 'Hodinky', 'export_garmin', { workoutId: w.id }, 'Připrav mi jednotku ' + name + ' jako soubor do hodinek Garmin.'));
      }
    } else if (w.status === 'skipped') {
      main = opener(icon('undo') + 'Obnovit', 'restore_workout', { workoutId: w.id, reason: 'obnoveno ve widgetu' }, 'Obnov jednotku ' + name + '.', ' class="btn block"');
    } else {
      // Zapsaná jednotka: pocit jedním klepnutím, bolest a okolnosti ve formuláři, hodnocení podle Stravy.
      h += feelRow(w);
      more.push(opener(icon('note') + 'Bolest, okolnosti', 'show_result', { workoutId: w.id }, 'Chci doplnit zápis k jednotce ' + name + '.'));

    }
    if (main) h += '<div class="a-main">' + main + '</div>';
    if (pair.length) h += '<div class="a-pair">' + pair.join('') + '</div>';
    if (moveId === w.id) h += dayPicker(w);

  }
  function doneButton(w, name, extra) {
    var label = isRun(w) ? 'Doběhnuto' : 'Hotovo';

    return '<button type="button" data-done="' + esc(w.id) + '" data-version="' + esc(w.version) + '" data-name="' + esc(name) + '"' + (extra || '') + '>' + icon('check') + label + '</button>';
  }
  function feelRow(w) {
    return '<div class="feel"><div class="fk">Pocit z tréninku<span>' + (w.feel ? w.feel + ' · ' + FEEL[w.feel] : '1 těžké · 5 výborné') + '</span></div><div class="scale" role="group" aria-label="Pocit">' + [1, 2, 3, 4, 5].map(function (n) {
      return '<button type="button" data-feel="' + esc(w.id) + '" data-val="' + n + '" data-version="' + esc(w.version) + '" data-status="' + w.status + '" title="' + FEEL[n] + '" aria-pressed="' + (w.feel === n) + '">' + n + '</button>';
    }).join('') + '</div></div>';
  }
  function markDone(el) {
    keepOpen = el.getAttribute('data-done');
    open('set_status', { workoutId: keepOpen, status: 'completed', seen: el.getAttribute('data-version') }, 'Doběhl jsem jednotku ' + el.getAttribute('data-name') + '. Zapiš ji jako splněnou.');
  }
  function saveFeel(el) {
    var id = el.getAttribute('data-feel'), n = Number(el.getAttribute('data-val'));

  }
  // Ikony kreslené barvou textu.
  var ICONS = {
    short: '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.1 8.1L20 20M8.1 15.9L20 4"/>',
    strava: '<path d="M3 12h4l3-8 4 16 3-8h4"/>',
    gauge: '<path d="M4.5 17a8.5 8.5 0 1 1 15 0"/><path d="M12 13l4-4"/><circle cx="12" cy="13" r="1.2"/>',
    watch: '<circle cx="12" cy="12" r="6"/><path d="M12 9.5V12l1.5 1.5M9 6.6L9.6 2h4.8l.6 4.6M9 17.4L9.6 22h4.8l.6-4.6"/>',
    undo: '<path d="M9 7L5 11l4 4"/><path d="M5 11h9a5 5 0 010 10h-2"/>',

    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    move: '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4M10 15h5M13 13l2 2-2 2"/>',
    skip: '<circle cx="12" cy="12" r="8.5"/><path d="M8 16L16 8"/>',
    cal: '<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M7.5 14h2M11 14h2M14.5 14h2"/>',
    bars: '<path d="M5 20V12M10 20V6M15 20V9M20 20V4"/>',
    chat: '<path d="M5 18.5V6.5A2.5 2.5 0 0 1 7.5 4h9A2.5 2.5 0 0 1 19 6.5v7a2.5 2.5 0 0 1-2.5 2.5H9z"/>',
    out: '<path d="M14 5h5v5M19 5l-8 8M17 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 4 18.5v-10A1.5 1.5 0 0 1 5.5 7H10"/>',
    left: '<path d="M14.5 6l-6 6 6 6"/>',
    right: '<path d="M9.5 6l6 6-6 6"/>'
  };
  function icon(k, c) { return '<svg class="i-' + k + (c ? ' ' + c : '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (k === 'check' ? 2.6 : 2) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[k] + '</svg>'; }

  // Hlavní trénink týdne: dnešní jednotka, jinak nejbližší naplánovaná.
  function heroOf(d) {
    if (!d.isCurrent) return null;
    var today = d.days.filter(function (x) { return x.isToday; })[0];
    var tw = today && today.workouts.filter(function (w) { return w.type !== 'rest' && w.status !== 'skipped'; })[0];
    if (tw) return { w: tw, label: 'Dnes · ' + when(tw) };
    var nw = null;
    d.days.forEach(function (day) { day.workouts.forEach(function (w) { if (w.id === d.nextId) nw = w; }); });
    if (!nw) return null;
    return { w: nw, label: (today ? 'Dnes volno · ' : '') + (nw.date === addDays(d.today, 1) ? 'zítra' : 'další') + ' ' + when(nw) };
  }
  function renderHero(hero) {
    var w = hero.w, kp = keyPace(w.lines), km = kmText(w);

      if (i % every === 0) svg += '<text x="' + x(i) + '" y="' + (H - 5) + '" text-anchor="middle">' + l.n + '</text>';
      var inT = t ? (l.paceSec >= t.fastSec - 2 && l.paceSec <= t.slowSec + 2 ? 'v cílovém pásmu' : l.paceSec < t.fastSec ? 'rychleji než cíl' : 'pomaleji než cíl') : '';
      hits += '<rect class="hit" x="' + (L + band * i) + '" y="' + T + '" width="' + band + '" height="' + (H - T - B) + '" rx="4"' + tipAttr('<b>Kolo ' + l.n + '</b>' + pace(l.paceSec) + ' /km · ' + meters(l.distanceM) + ' za ' + dur(l.durationSec) + (l.avgHr != null ? '<br>tep ' + Math.round(l.avgHr) : '') + (inT ? '<br><span>' + inT + '</span>' : '')) + '/>';
    });
    svg += hits + '<path d="' + path + '" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>' + dots + '</svg>';
    return svg + (t && v.steady && v.lapsInTarget != null ? '<div class="foot">V cílovém pásmu ' + v.lapsInTarget + ' z ' + n + ' kol.</div>' : '');
  }
  function pickRow(key, options, current, label) {
    return '<div class="pick" role="group" aria-label="' + esc(label) + '">' + options.map(function (o) {
      var on = Array.isArray(current) ? current.indexOf(o[0]) >= 0 : String(current) === String(o[0]);
      return '<button type="button" data-pick="' + key + '" data-val="' + esc(o[0]) + '" aria-pressed="' + on + '">' + esc(o[1]) + '</button>';
    }).join('') + '</div>';
  }
  function ring(total, tn) {
    var r = 36, c = 2 * Math.PI * r, f = Math.max(0, Math.min(100, total)) / 100 * c;
    return '<div class="ring"><svg viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="8"/><circle cx="42" cy="42" r="' + r + '" fill="none" stroke="var(--' + tn + ')" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + f + ' ' + c + '"/></svg><b class="num">' + total + '<small>%</small></b></div>';
  }
  function renderResult(d, width) {
    var r = d.run, w = d.workout, t = d.target, sc = d.score, c = d.checkin, v = d.verdict || {}, tn = tone(w.type) === 'other' ? 'good' : tone(w.type);
    if (tn === 'race') tn = 'ink';
    if (!form || form.id !== w.id) form = { id: w.id, status: c.status === 'scheduled' || c.status === 'skipped' ? (sc ? sc.suggestedStatus : 'completed') : c.status, feel: c.feel, pain: c.pain || 'none', conditions: c.conditions.slice() };
    var recorded = c.status === 'completed' || c.status === 'partial';
    var h = head(null, d) + (backDate ? '<div class="back">' + opener(icon('left') + 'Týden', 'show_week', { date: backDate }, 'Ukaž mi týden.') + '</div>' : '');
    h += '<div class="hero-k"><span class="eyebrow">Hodnocení · ' + DOW[w.dow] + ' ' + dm(w.date) + '</span>' + (recorded ? '<span class="tag t-' + tone(w.type) + '">' + STATUS[c.status] + '</span>' : '') + '</div><h2>' + esc(w.title) + '</h2>';
    h += '<div class="sub">Plán: ' + esc(w.summary) + '</div>';
    if (r) {
      if (sc) {
        var rows = sc.parts.map(function (p) { return '<li><span>' + esc(p.label) + ':</span> ' + esc(p.text) + '</li>'; });
        if (d.estimate) rows.push('<li><span>Forma:</span> ' + dur(d.estimate.sec) + ' na ' + num(Math.round(d.estimate.distanceM / 100) / 10) + ' km</li>');
        h += '<div class="score">' + ring(sc.total, tn) + '<div><div class="lbl">' + esc(sc.label) + '</div><ul>' + rows.join('') + '</ul></div></div>';
      }
      var dOk = v.distance === 'ok', pOk = v.pace === 'in';
      h += '<div class="tiles">';
      h += tile('Vzdálenost', num(Math.round(r.distanceM / 10) / 100) + ' <small>km</small>', 'plán ' + (w.kmMax ? kmRange(w.kmMin, w.kmMax) + ' km' : '–'), v.distance ? (dOk ? 'good' : 'warn') : '');
      h += tile('Tempo', pace(r.avgPaceSec) + ' <small>/km</small>', t && v.steady ? 'cíl ' + pace(t.fastSec) + '–' + pace(t.slowSec) : 'průměr celého běhu', v.pace ? (pOk ? 'good' : 'warn') : '');
      h += tile('Čas', dur(r.movingSec), r.elevGainM != null ? '+' + Math.round(r.elevGainM) + ' m' : '');
      h += r.avgHr != null ? tile('Tep', Math.round(r.avgHr) + ' <small>/min</small>') : tile('Kola', r.laps.length || '–');
      h += '</div>';
      if (r.reps && r.reps.length) {
        // Stejně dlouhé úseky: délka jednou v nadpisu; u kilometrových je čas totéž co tempo.
        var same = r.reps.every(function (x) { return x.distanceM === r.reps[0].distanceM; });
        var showTime = !same || r.reps[0].distanceM !== 1000;
        var showHr = r.reps.some(function (x) { return x.avgHr != null; });
        h += '<h3>Rychlé úseky' + (same ? ' · ' + r.reps.length + '× ' + meters(r.reps[0].distanceM) : '') + (t ? ' · cíl ' + pace(t.fastSec) + '–' + pace(t.slowSec) : '') + '</h3><table><thead><tr><th>#</th>' + (same ? '' : '<th>Délka</th>') + (showTime ? '<th>Čas</th>' : '') + '<th>Tempo</th>' + (showHr ? '<th>Tep</th>' : '') + '<th>Cíl</th></tr></thead><tbody>';
        r.reps.forEach(function (x) {
          var off = x.offSec === 0 ? '<span class="dev in" title="v cílovém pásmu">v pásmu</span>' : '<span class="dev off" title="' + (x.offSec > 0 ? 'pomaleji' : 'rychleji') + ' než cíl">' + (x.offSec > 0 ? '+' : '−') + Math.abs(Math.round(x.offSec)) + ' s</span>';
          h += '<tr><td>' + x.n + '</td>' + (same ? '' : '<td>' + meters(x.distanceM) + '</td>') + (showTime ? '<td>' + dur(x.durationSec) + '</td>' : '') + '<td><b>' + pace(x.paceSec) + '</b></td>' + (showHr ? '<td>' + (x.avgHr != null ? Math.round(x.avgHr) : '–') + '</td>' : '') + '<td>' + off + '</td></tr>';
        });
        h += '</tbody></table>';
      }
      if (r.laps.length > 1 && r.reps && r.reps.length) h += '<details><summary>Tempo po kolech</summary>' + lapChart(r, t, v, width, tn) + '</details>';
      else if (r.laps.length > 1) h += '<h3>Tempo po kolech' + (t ? ' · pruh je cíl' : '') + '</h3>' + lapChart(r, t, v, width, tn);
    }
    // Zápis je volitelný: u běhu s čísly je sbalený a otevře se jen na přání. Bez čísel je to hlavní obsah karty.
    var logOpen = form.showLog != null ? form.showLog : !r;
    if (recorded) h += feelRow({ id: w.id, version: c.version, status: c.status, feel: c.feel });
    var logSum = recorded ? 'Upravit zápis: ' + STATUS[c.status].toLowerCase() + (c.pain && c.pain !== 'none' ? ' · bolest' : '') + (c.saved && c.saved.length ? ' · okolnosti ' + c.saved.length : '') : 'Zapsat splnění a pocit';
    h += '<details class="card" data-log="1"' + (logOpen ? ' open' : '') + '><summary>' + esc(logSum) + '</summary><div class="fk2">Stav</div>' + pickRow('status', [['completed', 'Splněno'], ['partial', 'Částečně']], form.status, 'Stav');
    h += '<div class="fk2">Pocit</div>' + pickRow('feel', [1, 2, 3, 4, 5].map(function (n) { return [n, n + ' · ' + FEEL[n]]; }), form.feel, 'Pocit');
    h += '<div class="fk2">Bolest</div>' + pickRow('pain', PAIN, form.pain, 'Bolest');
    // Okolnosti jsou sbalené, dokud žádná není vybraná: běžný zápis je pak krátký.
    var condOpen = form.showCond || form.conditions.length > 0;
    h += '<details class="cond" data-cond="1"' + (condOpen ? ' open' : '') + '><summary>Okolnosti' + (form.conditions.length ? ' (' + form.conditions.length + ')' : ': zima, vítr, spánek, alkohol…') + '</summary>' + pickRow('cond', Object.keys(d.conditionLabels).map(function (k) { return [k, d.conditionLabels[k]]; }), form.conditions, 'Okolnosti') + '</details>';
    h += '<div class="save"><button type="button" class="btn primary block" data-save="1">Uložit zápis</button></div></details>';
    if (!r) h += '<div class="a-main">' + (appHost ? opener(icon('strava') + 'Zhodnotit podle Stravy', 'strava_evaluate', evalArgs(w), 'Zhodnoť můj běh.', ' class="btn block"') : strava
      ? sayBtn(icon('strava') + 'Zhodnotit podle Stravy', 'Najdi ve Stravě můj běh z ' + dm(w.date) + ' a zhodnoť ho proti jednotce ' + w.title + '.', ' class="btn block"')
      : sayBtn('Zadat čísla běhu', 'Chci zhodnotit běh z ' + dm(w.date) + ' proti jednotce ' + w.title + '. Zeptej se mě na vzdálenost, čas a případně kola.', ' class="btn block"')) + '</div>';
    if (w.lines.length) h += '<details><summary>Předpis jednotky</summary><div class="t-' + tone(w.type) + '">' + steps(w.lines) + '</div></details>';
    return h + hints([['Co dál?', 'Co z toho plyne pro další dny?']]);
  }
  function saveCheckin(d) {
    // Posílá se jen to, co uživatel v kartě změnil, s verzí zápisu, kterou karta viděla:
    // starší karta téhož běhu tak nepřepíše novější zápis.
    var w = d.workout, c = d.checkin, args = { workoutId: w.id, status: form.status, seen: c.version };
    var same = function (a, b) { return a.slice().sort().join() === b.slice().sort().join(); };
    if (!same(form.conditions, c.saved || [])) args.conditions = form.conditions.slice();
    if (form.pain !== (c.pain || 'none')) args.pain = form.pain;
    if (form.feel && form.feel !== c.feel) args.feel = form.feel;
    if (d.estimate) args.estimateVdot = d.estimate.vdot;
    if (form.status === c.status && !args.conditions && !args.pain && !args.feel) { form.showLog = false; render(); return; }
    var parts = [form.status === 'partial' ? 'splněno částečně' : 'splněno'];
    if (form.feel) parts.push('pocit ' + form.feel + ' z 5 (' + FEEL[form.feel] + ')');
    if (form.pain && form.pain !== 'none') parts.push('bolest ' + (form.pain === 'mild' ? 'mírná' : 'výrazná'));
    if (form.conditions.length) parts.push('okolnosti: ' + form.conditions.map(function (k) { return d.conditionLabels[k]; }).join(', '));
    var summary = w.title + ' (' + DOW[w.dow] + ' ' + dm(w.date) + '): ' + parts.join(', ') + '.';
    open('set_status', args, 'Zapiš jednotku ' + summary, 'zapsal jednotku ' + summary);
  }

  // ---------- Soubor do hodinek ----------
  function renderGarmin(d) {
    var w = d.workout, h = head(null, d) + '<div class="eyebrow">Soubor do hodinek Garmin · ' + DOW[w.dow] + ' ' + dm(w.date) + '</div><h2>' + esc(w.title) + '</h2>';
    h += '<div class="sub">' + d.steps.length + ' kroků' + (d.hasPaces ? ' s cílovými tempy' : '') + '</div>';
    h += '<div class="a-main"><a class="btn primary block" data-link="1" href="' + esc(d.url) + '" target="_blank" rel="noopener">Stáhnout soubor .fit</a></div>';
    h += '<details><summary>Kroky a jak soubor nahrát</summary><ol class="howto fit">' + d.steps.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ol>';
    return h + '<p class="sub">Hodinky připoj kabelem k počítači a soubor zkopíruj do složky GARMIN/NewFiles. Odkaz platí 24 hodin.</p></details>';
  }

  // ---------- Vykreslení a velikost ----------
  var lastWidth = 0, lastHeight = 0;
  function render() {
    tips = []; hideTip();
    var width = app.clientWidth - (inApp ? 32 : 34);
    lastWidth = app.clientWidth;
    var html;
    if (!data) html = head(retry || inApp ? null : '', null) + '<p class="empty">' + esc(plain) + '</p>' + (retry ? '<div class="a-main">' + opener('Načíst aktuální týden', 'show_week', {}, 'Ukaž mi tento týden.', ' class="btn primary block"') + '</div>' : '');
    else if (data.view === 'none') { app.innerHTML = ''; app.style.display = 'none'; notify('ui/notifications/request-teardown', {}); return; }
    else html = data.view === 'week' ? renderWeek(data) : data.view === 'plan' ? renderPlan(data, width) : data.view === 'paces' ? renderPaces(data) : data.view === 'result' ? renderResult(data, width) : data.view === 'garmin' ? renderGarmin(data) : data.view === 'finished' ? renderFinished(data) : data.view === 'import' ? renderImport(data) : data.view === 'empty' ? renderEmpty(data) : '<p class="empty">Neznámé zobrazení.</p>';
    app.innerHTML = html + (inApp ? tabBar() : '');
    // V aplikaci nový pohled (jiná záložka, jiný týden) začíná nahoře; po akci v témž pohledu zůstane pozice.
    var key = data ? data.view + '|' + (data.weekStart || (data.workout && data.workout.id) || '') : '';
    if (inApp && key !== shownKey) window.scrollTo(0, 0);
    shownKey = key;
    if (jumpTo) { var row = app.querySelector('[data-row="' + jumpTo + '"]'); jumpTo = null; if (row) row.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    if (inApp) return;
    // Ve skrytém rámu se překreslovací zpětná volání nespouštějí; hostitel, který kartu ukáže až podle výšky, by ji jinak nedostal.
    requestAnimationFrame(reportSize);
    setTimeout(reportSize, 60);
    setTimeout(reportSize, 400);
  }
  // Stejně jako oficiální SDK MCP Apps: dokument se změří s height: max-content (vlastní výška obsahu,
  // ne výška rámu od hostitele) a posílá se výška i šířka. Jen tak hostitel kartu po přepnutí
  // na kratší záložku i zmenší; z výšky samotné a z výšky rámu zůstávalo dole prázdné místo.
  var lastSentWidth = 0, tallest = 0;
  function reportSize() {
    if (inApp) return;
    var root = document.documentElement, prev = root.style.height;
    app.style.minHeight = '';
    root.style.height = 'max-content';
    var natural = Math.ceil(root.getBoundingClientRect().height);
    // Hostitel rámeček nezmenší: karta se roztáhne na dosavadní maximum, aby pod ní nezůstalo prázdno.
    if (natural < tallest) app.style.minHeight = (tallest - (natural - Math.ceil(app.getBoundingClientRect().height))) + 'px';
    var h = Math.ceil(root.getBoundingClientRect().height);
    tallest = Math.max(tallest, h);
    root.style.height = prev;
    var w = Math.ceil(window.innerWidth);
    if (Math.abs(h - lastHeight) < 1 && w === lastSentWidth) return;
    lastHeight = h; lastSentWidth = w;
    notify('ui/notifications/size-changed', { width: w, height: h });
    if (oai && typeof oai.notifyIntrinsicHeight === 'function') { try { oai.notifyIntrinsicHeight(h); } catch (err) { /* hostitel výšku neumí */ } }
  }
  if (window.ResizeObserver) {
    new ResizeObserver(function () { if ((data || plain) && Math.abs(app.clientWidth - lastWidth) > 4) render(); reportSize(); }).observe(document.body);
    new ResizeObserver(reportSize).observe(app);
  }
  app.addEventListener('toggle', function (e) { if (form && e.target.hasAttribute && e.target.hasAttribute('data-cond')) form.showCond = e.target.open; if (form && e.target.hasAttribute && e.target.hasAttribute('data-log')) form.showLog = e.target.open; reportSize(); }, true);

  // Hostitel data nepošle (karta znovu načtená po čase): po 8 s nabídne načíst aktuální stav místo nekonečného čekání.
  var retry = false;
  setTimeout(function () { if (!data && !plain) { retry = true; plain = 'Karta se nenačetla.'; render(); } }, inApp ? 15000 : 8000);
  if (!host) { app.innerHTML = '<p class="empty">Tenhle widget se zobrazuje v konverzaci s Claude nebo ChatGPT, když je připojený konektor Run Tracker. Aplikace je na adrese /app/.</p>'; return; }
  if (oai) {
    applyTheme(oai.theme);
    if (oai.toolOutput && oai.toolOutput.view) showResult({ structuredContent: oai.toolOutput }, true);
    window.addEventListener('openai:set_globals', function (e) {
      var g = e.detail && e.detail.globals;
      if (!g) return;
      if (g.theme) applyTheme(g.theme);
      if (g.toolOutput && g.toolOutput.view) showResult({ structuredContent: g.toolOutput }, true);
    });
  }
  request('ui/initialize', { appInfo: { name: 'run-tracker-view', version: '0.6.0' }, appCapabilities: {}, protocolVersion: '2026-01-26' }, 10000)
    .then(function (result) {
      var name = result && result.hostInfo && result.hostInfo.name;
      mode = name === 'run-tracker-app' ? 'app' : name === 'run-tracker-pwa' ? 'pwa' : 'chat';
      appHost = mode === 'app'; inApp = mode !== 'chat';
      if (inApp) document.documentElement.classList.add('app');
      applyHost(result && result.hostContext);
      notify('ui/notifications/initialized');
      if (inApp) render();
    })
    .catch(function () { notify('ui/notifications/initialized'); });
})();
</script>
