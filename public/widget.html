<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Tracker</title>
<style>
:root {
  color-scheme: light;
  --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10); --wash: rgba(11,11,11,.04);
  --s1: #2a78d6; --s1-soft: #b7d3f6; --s2: #eb6834; --band: rgba(42,120,214,.13);
  --good: #0ca30c; --good-ink: #006300; --warn: #fab219; --warn-ink: #7a5200; --crit: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --wash: rgba(255,255,255,.05);
    --s1: #3987e5; --s1-soft: #184f95; --s2: #d95926; --band: rgba(57,135,229,.18);
    --good: #0ca30c; --good-ink: #0ca30c; --warn: #fab219; --warn-ink: #fab219; --crit: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --wash: rgba(255,255,255,.05);
  --s1: #3987e5; --s1-soft: #184f95; --s2: #d95926; --band: rgba(57,135,229,.18);
  --good: #0ca30c; --good-ink: #0ca30c; --warn: #fab219; --warn-ink: #fab219; --crit: #e66767;
}
* { box-sizing: border-box; }
html, body { height: auto; min-height: 0; margin: 0; background: transparent; overflow: hidden; }
body { color: var(--ink); font: 14px/1.45 var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif); }
#app { position: relative; max-width: 540px; padding: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; transition: opacity .15s; }
#app.busy { opacity: .6; pointer-events: none; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, summary:focus-visible, [data-open]:focus-visible, [data-tip]:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }

/* záhlaví */
.tabs { display: flex; gap: 4px; max-width: 300px; margin: -2px 0 12px; padding: 3px; border-radius: 10px; background: var(--wash); }
.tabs button { flex: 1; min-height: 40px; border: 0; border-radius: 8px; background: none; color: var(--ink2); font-weight: 600; cursor: pointer; }
.tabs button[aria-current="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--border); }
.eyebrow { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
h2 { margin: 2px 0 0; font-size: 19px; line-height: 1.2; letter-spacing: -.01em; }
h3 { margin: 18px 0 8px; font-size: 13px; font-weight: 600; color: var(--ink2); }
.sub { color: var(--ink2); font-size: 13px; }
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.nav { display: flex; gap: 6px; flex: none; }
.nav button { min-width: 44px; min-height: 44px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font-size: 18px; cursor: pointer; }
.nav button[disabled] { opacity: .35; cursor: default; }

/* hlášky */
.note { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; }
.note > span { flex: 1; min-width: 0; }
.note.ok { border-color: var(--good); }
.note.err { border-color: var(--crit); }
.note button { min-height: 44px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font-weight: 600; cursor: pointer; }

/* dlaždice */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
.tiles.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tile { min-width: 0; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; }
.tile .k { color: var(--ink2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { font-size: 18px; font-weight: 650; line-height: 1.15; letter-spacing: -.01em; }
.tile .v small { font-size: 13px; font-weight: 500; color: var(--ink2); }
.tile .n { margin-top: 2px; color: var(--ink2); font-size: 12px; }
.meter { height: 6px; margin-top: 7px; border-radius: 3px; background: var(--s1-soft); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; background: var(--s1); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border: 1px solid var(--border); border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; color: var(--ink2); }
.chip.good { color: var(--good-ink); border-color: var(--good); }
.chip.warn { color: var(--warn-ink); border-color: var(--warn); }

/* týden */
.days { list-style: none; margin: 12px 0 0; padding: 0; border-top: 1px solid var(--grid); }
.day { border-bottom: 1px solid var(--grid); }
.row { display: grid; grid-template-columns: 50px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; width: 100%; min-height: 52px; padding: 8px 6px; border: 0; border-radius: 8px; background: none; text-align: left; }
button.row { cursor: pointer; }
button.row[aria-expanded="true"] { background: var(--wash); }
.day.today .row { box-shadow: inset 3px 0 0 var(--s1); }
.row .when, .row .what, .row .t, .row .s, .row .bar { display: block; }
.row .when { color: var(--ink2); font-size: 12px; font-variant-numeric: tabular-nums; }
.row .when b { display: block; color: var(--ink); font-size: 13px; text-transform: capitalize; }
.row .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s { color: var(--ink2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.day.rest .t { font-weight: 500; color: var(--muted); }
.row .bar { grid-column: 2 / 4; height: 4px; border-radius: 2px; background: var(--s1-soft); }
.row .bar.done { background: var(--s1); }
.row .bar.skip { background: none; border: 1px dashed var(--axis); }
.acts { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 6px 12px; }
.acts ul { flex-basis: 100%; margin: 0 0 4px; padding-left: 18px; color: var(--ink2); font-size: 13px; }
.acts > button { min-height: 44px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font-size: 13px; font-weight: 600; cursor: pointer; }
.acts > button.main { border-color: var(--s1); background: var(--s1); color: #fff; }
.links { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 0 4px; }
.links button { min-height: 44px; padding: 0 12px 0 0; border: 0; background: none; color: var(--s1); font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.daypick { flex-basis: 100%; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin: 2px 0 2px; }
.daypick button { position: relative; min-height: 44px; padding: 2px 0; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font-size: 12px; line-height: 1.15; cursor: pointer; }
.daypick button b { display: block; font-size: 13px; }
.daypick button[disabled] { opacity: .35; cursor: default; }
.daypick button.busy::after { content: ""; position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--s2); }
.hintline { flex-basis: 100%; color: var(--muted); font-size: 12px; }

/* grafy a tabulky */
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 4px 0 2px; color: var(--ink2); font-size: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border-radius: 3px; vertical-align: -1px; }
.legend i.dot { border-radius: 50%; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--muted); font-size: 11px; font-family: inherit; font-variant-numeric: tabular-nums; }
svg text.strong { fill: var(--ink); font-weight: 650; }
svg .hit { fill: transparent; }
svg .hit[data-open] { cursor: pointer; }
svg :not(.hit) { pointer-events: none; }
svg .hit:hover, svg .hit.on { fill: var(--wash); }
details { margin-top: 10px; font-size: 13px; }
summary { min-height: 32px; cursor: pointer; color: var(--ink2); }
table { width: 100%; margin-top: 6px; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 5px 6px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; }
th { color: var(--ink2); font-weight: 600; }
th:first-child, td:first-child { text-align: left; white-space: normal; }
.zones { display: grid; grid-template-columns: minmax(84px, auto) minmax(60px, 1fr) auto; gap: 7px 10px; align-items: center; }
.zones .zl { font-weight: 600; font-size: 13px; }
.zones .zr { color: var(--ink2); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.track { position: relative; height: 12px; border-radius: 6px; background: var(--wash); }
.track i { position: absolute; top: 0; bottom: 0; min-width: 4px; border-radius: 4px; background: var(--s1); }
.track b { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--ink); }
.pred { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
.pred > div { min-width: 0; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; }
.pred .k { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink2); font-size: 11.5px; }
.pred .v { font-weight: 650; font-variant-numeric: tabular-nums; }
.tip { position: absolute; z-index: 5; max-width: 220px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); box-shadow: 0 6px 20px rgba(0,0,0,.18); color: var(--ink); font-size: 12px; pointer-events: none; }
.tip b { display: block; margin-bottom: 2px; }
.tip span { color: var(--ink2); }

/* doběhnuto */
.score { display: flex; align-items: center; gap: 14px; margin-top: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; }
.score .big { flex: none; white-space: nowrap; font-size: 30px; font-weight: 700; line-height: 1; letter-spacing: -.02em; }
.score .big small { font-size: 15px; font-weight: 600; color: var(--ink2); }
.score ul { margin: 2px 0 0; padding: 0; list-style: none; color: var(--ink2); font-size: 12.5px; }
.form { margin-top: 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; }
.form .k { margin: 10px 0 5px; color: var(--ink2); font-size: 12px; font-weight: 600; }
.form .k:first-child { margin-top: 0; }
.form details.cond { margin-top: 10px; }
.form details.cond summary { display: flex; align-items: center; min-height: 44px; color: var(--ink2); font-size: 12px; font-weight: 600; }
.pick { display: flex; flex-wrap: wrap; gap: 5px; }
.pick button { min-height: 44px; padding: 0 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); font-size: 13px; cursor: pointer; }
.pick button[aria-pressed="true"] { border-color: var(--s1); background: var(--s1); color: #fff; font-weight: 600; }
.primary { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; margin-top: 12px; padding: 0 16px; border: 0; border-radius: 9px; background: var(--s1); color: #fff; font-weight: 650; text-decoration: none; cursor: pointer; }

/* ostatní */
.hints { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--grid); }
.hints .k { margin-bottom: 6px; color: var(--muted); font-size: 12px; }
.hints div { display: flex; flex-wrap: wrap; gap: 6px; }
.hints button { min-height: 44px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); font-size: 13px; text-align: left; cursor: pointer; }
.steps { margin: 10px 0 0; padding-left: 20px; color: var(--ink2); }
.steps li { margin-bottom: 4px; }
.steps.fit { color: var(--ink); font-size: 13px; font-variant-numeric: tabular-nums; }
.foot { margin-top: 12px; color: var(--muted); font-size: 12px; }
.empty { color: var(--ink2); }
</style>
</head>
<body>
<div id="app"><p class="empty">Načítám…</p></div>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var DOW = ['po', 'út', 'st', 'čt', 'pá', 'so', 'ne'];
  var FEEL = ['', 'hodně těžké', 'těžké', 'normální', 'dobré', 'výborné'];
  var PAIN = [['none', 'žádná'], ['mild', 'mírná'], ['significant', 'výrazná']];
  var STATUS = {
    completed: { label: 'Splněno', icon: '✓', cls: 'good' },
    partial: { label: 'Částečně', icon: '◐', cls: 'warn' },
    skipped: { label: 'Vynecháno', icon: '–', cls: '' },
    scheduled: { label: 'V plánu', icon: '○', cls: '' }
  };
  // Nástroje, které mění data: model se o změně z widgetu dozví přes kontext.
  var CHANGES = { move_workout: 1, skip_workout: 1, restore_workout: 1, undo_change: 1, set_status: 1 };
  var noop = function () {};
  // ChatGPT k standardu MCP Apps přidává vlastní rozhraní window.openai: výška karty, odkazy, barevný režim a data.
  var oai = window.openai || null;
  // Oficiální konektor Stravy je v Claude, v ChatGPT ne: tam se čísla běhu zadávají ručně nebo souborem.
  var strava = !oai;
  var lastOutput = '';

  // Stav widgetu
  var data = null;        // data posledního pohledu
  var plain = '';         // text, když pohled nemá data (chyba nástroje)
  var openId = null;      // rozbalená jednotka v týdnu
  var moveId = null;      // jednotka s otevřeným výběrem dne
  var form = null;        // rozpracovaný zápis doběhnuté jednotky
  var errorText = '';     // chyba poslední akce
  var sayText = '';       // zpráva, kterou hostitel neodeslal a uživatel ji musí napsat sám
  var busy = false;
  var widgetChange = null; // popis změny z widgetu pro model

  // ---------- Protokol MCP Apps: JSON-RPC přes postMessage s hostitelem ----------
  var host = window.parent !== window ? window.parent : null;
  var nextId = 1, pending = {};
  function post(msg) { if (host) host.postMessage(msg, '*'); }
  // Každý požadavek má časový limit, aby widget nezůstal zamrzlý, když hostitel neodpoví.
  function request(method, params, timeoutMs) {
    var id = nextId++;
    post({ jsonrpc: '2.0', id: id, method: method, params: params || {} });
    return new Promise(function (resolve, reject) {
      var timer = setTimeout(function () { if (pending[id]) { delete pending[id]; reject(new Error('timeout')); } }, timeoutMs || 15000);
      pending[id] = {
        resolve: function (v) { clearTimeout(timer); resolve(v); },
        reject: function (e) { clearTimeout(timer); reject(e); }
      };
    });
  }
  function notify(method, params) { post({ jsonrpc: '2.0', method: method, params: params || {} }); }
  function applyTheme(theme) { if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme); }
  function applyHost(ctx) {
    if (!ctx) return;
    applyTheme(ctx.theme);
    var vars = ctx.styles && ctx.styles.variables;
    if (vars && vars['--font-sans']) document.documentElement.style.setProperty('--font-sans', vars['--font-sans']);
  }
  window.addEventListener('message', function (e) {
    if (e.source !== host) return;
    var m = e.data;
    if (!m || m.jsonrpc !== '2.0') return;
    if (m.method) {
      if (m.method === 'ui/notifications/tool-result') showResult(m.params, true);
      else if (m.method === 'ui/notifications/host-context-changed') applyHost(m.params);
      else if (m.method === 'ui/notifications/tool-cancelled') { data = null; plain = 'Zobrazení bylo zrušeno.'; render(); }
      if (m.id != null) post({ jsonrpc: '2.0', id: m.id, result: {} });
    } else if (m.id != null && pending[m.id]) {
      var p = pending[m.id]; delete pending[m.id];
      if (m.error) p.reject(m.error); else p.resolve(m.result);
    }
  });

  function textOf(result) { return result && result.content && result.content[0] && result.content[0].text; }

  // Pošle za uživatele zprávu do konverzace. Když to hostitel neumí, ukáže text k opsání.
  function say(text) {
    request('ui/message', { role: 'user', content: [{ type: 'text', text: text }] }, 10000)
      .then(function (r) { if (r && r.isError) throw new Error('rejected'); })
      .catch(function () { sayText = text; render(); });
  }

  // Akce bez psaní: widget zavolá nástroj konektoru přímo. Když to nejde, pošle větu do konverzace.
  function open(name, args, fallback, note) {
    if (busy) return;
    busy = true; errorText = ''; sayText = '';
    if (CHANGES[name] || (args && args.save)) widgetChange = note || true;
    app.classList.add('busy');
    request('tools/call', { name: name, arguments: args || {} }, 20000)
      .then(function (r) {
        if (r && r.structuredContent && r.structuredContent.view) { showResult(r); return; }
        if (r && r.isError) { widgetChange = null; errorText = textOf(r) || 'Akce se nepovedla.'; render(); return; }
        throw new Error('no data');
      })
      .catch(function () { widgetChange = null; say(fallback); })
      .then(function () { busy = false; app.classList.remove('busy'); });
  }

  function showResult(result, fromHost) {
    var d = result && result.structuredContent;
    // Stejná data od hostitele mohou přijít standardní cestou i přes window.openai; podruhé se nepřekreslují.
    var key = d ? JSON.stringify(d) : '';
    if (fromHost && key && key === lastOutput) return;
    lastOutput = key;
    if (widgetChange && d && d.banner) {
      // Změnu udělal uživatel klepnutím, ne model: dát mu vědět, aby radil nad aktuálním stavem.
      var what = widgetChange === true ? d.banner.text : widgetChange;
      request('ui/update-model-context', { content: [{ type: 'text', text: 'Uživatel ve widgetu Run Trackeru: ' + what + ' Než budeš radit, načti aktuální stav přes get_plan.' }] }, 10000).catch(noop);
    }
    widgetChange = null;
    moveId = null;
    if (d && d.view) {
      // Nejbližší jednotka je rozbalená hned: je vidět, co běžet a co s ní jde udělat.
      if (d.view === 'week') openId = !d.banner && d.isCurrent ? d.nextId : null;
      if (d.view !== 'result') form = null;
      data = d;
    } else {
      data = null;
      plain = textOf(result) || 'Není co zobrazit.';
    }
    render();
  }

  // ---------- Formátování ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function num(n, d) { return (d == null ? String(n) : n.toFixed(d)).replace('.', ','); }
  function kmRange(a, b) { return a === b ? num(a) : num(a) + '–' + num(b); }
  function kmRound(a, b) { return a === b ? num(a) : Math.round(a) + '–' + Math.round(b); }
  function pace(sec) { var s = Math.round(sec); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  function dur(sec) {
    var s = Math.round(sec), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
    return h ? h + ':' + ('0' + m).slice(-2) + ':' + ('0' + r).slice(-2) : m + ':' + ('0' + r).slice(-2);
  }
  function dm(iso) { var p = iso.split('-'); return Number(p[2]) + '. ' + Number(p[1]) + '.'; }
  function addDays(iso, n) { var d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function dowOf(iso) { return (new Date(iso + 'T12:00:00Z').getUTCDay() + 6) % 7; }
  function when(w) { return DOW[dowOf(w.date)] + ' ' + dm(w.date); }
  function kmh(secPerKm) { return 3600 / secPerKm; }
  function meters(m) { return m >= 1000 ? num(Math.round(m / 10) / 100) + ' km' : Math.round(m) + ' m'; }
  function niceMax(v) { var step = v <= 20 ? 5 : v <= 60 ? 10 : 20; return Math.max(step, Math.ceil(v / step) * step); }
  function chip(status) { var s = STATUS[status] || STATUS.scheduled; return '<span class="chip ' + s.cls + '"><span aria-hidden="true">' + s.icon + '</span>' + s.label + '</span>'; }

  // ---------- Tooltip ----------
  var tips = [], tipEl = null;
  function tipAttr(html) { tips.push(html); return ' data-tip="' + (tips.length - 1) + '" tabindex="0"'; }
  function showTip(target) {
    hideTip();
    var html = tips[Number(target.getAttribute('data-tip'))];
    if (!html) return;
    tipEl = document.createElement('div'); tipEl.className = 'tip'; tipEl.innerHTML = html; app.appendChild(tipEl);
    var a = app.getBoundingClientRect(), t = target.getBoundingClientRect();
    var left = Math.max(6, Math.min(t.left - a.left + t.width / 2 - tipEl.offsetWidth / 2, a.width - tipEl.offsetWidth - 6));
    var top = t.top - a.top - tipEl.offsetHeight - 6;
    if (top < 4) top = Math.min(a.height - tipEl.offsetHeight - 4, t.top - a.top + 24);
    tipEl.style.left = left + 'px'; tipEl.style.top = top + 'px';
    target.classList.add('on');
  }
  function hideTip() {
    if (tipEl) { tipEl.remove(); tipEl = null; }
    var on = app.querySelectorAll('.on'); for (var i = 0; i < on.length; i++) on[i].classList.remove('on');
  }

        h += '<div class="links">' + opener('Soubor do hodinek', 'export_garmin', { workoutId: w.id }, 'Připrav mi tuhle jednotku jako soubor do hodinek Garmin.') + '</div>';
      }
    }
    if (c) {
      h += '<div class="sub">Z výkonu ' + num(Math.round(c.distanceM / 100) / 10) + ' km za ' + dur(c.timeSec) + ' · VDOT ' + num(c.vdot) + (c.saved ? ' · uloženo v profilu' : '') + '</div>';
      h += '<h3>Předpověď závodů</h3><div class="pred">' + c.predictions.map(function (x) { return '<div><div class="k">' + esc(x.label) + '</div><div class="v">' + dur(x.timeSec) + '</div></div>'; }).join('') + '</div>';
      h += '<div class="foot">Výpočet podle vzorců Jacka Danielse. Předpověď platí, když na danou vzdálenost i trénuješ.</div>';
      if (!c.saved) h += opener('Uložit tato tempa', 'calculate_paces', { distanceM: c.distanceM, timeSec: c.timeSec, save: true }, 'Ulož mi tato tempa do profilu.', ' class="primary"');
    }
    if (d.paces.length) {
      h += '<h3>Pásma</h3>' + zones(d.paces);
      h += '<details><summary>Převody na 400 m a km/h</summary><table><thead><tr><th>Pásmo</th><th>400 m</th><th>km/h</th></tr></thead><tbody>';
      d.paces.forEach(function (p) { h += '<tr><td>' + esc(p.label) + '</td><td>' + dur(p.fromSec * 0.4) + '–' + dur(p.toSec * 0.4) + '</td><td>' + num(kmh(p.toSec), 1) + '–' + num(kmh(p.fromSec), 1) + '</td></tr>'; });
      h += '</tbody></table></details>';
    } else h += '<p class="empty">Tempa zatím nejsou zadaná.</p>';
    return h + (c ? '' : hints(['Můj poslední půlmaraton byl za 1:45. Spočítej mi tempa.']));
  }

  // ---------- Doběhnuto: hodnocení splnění a zápis ----------
  function lapChart(r, t, v, width) {
    var W = Math.max(260, width), H = 180, L = 38, R = 8, T = 10, B = 24, n = r.laps.length, lo = Infinity, hi = -Infinity;
    r.laps.forEach(function (l) { lo = Math.min(lo, l.paceSec); hi = Math.max(hi, l.paceSec); });
    if (t) { lo = Math.min(lo, t.fastSec); hi = Math.max(hi, t.slowSec); }
    var step = hi - lo > 240 ? 60 : hi - lo > 100 ? 30 : 15;
    lo = Math.floor((lo - 5) / step) * step; hi = Math.ceil((hi + 5) / step) * step;
    // rychlejší tempo je nahoře
    var y = function (s) { return T + (H - T - B) * ((s - lo) / (hi - lo)); };
    var band = (W - L - R) / n, x = function (i) { return L + band * i + band / 2; };
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Tempo po kolech proti cílovému pásmu">';
    for (var s = lo; s <= hi; s += step) svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(s) + '" y2="' + y(s) + '" stroke="var(--grid)"/><text x="' + (L - 6) + '" y="' + (y(s) + 4) + '" text-anchor="end">' + pace(s) + '</text>';
    if (t) svg += '<rect x="' + L + '" y="' + y(t.fastSec) + '" width="' + (W - L - R) + '" height="' + Math.max(2, y(t.slowSec) - y(t.fastSec)) + '" fill="var(--band)"/>';
    var path = '', dots = '', hits = '', every = Math.ceil(n / Math.max(1, Math.floor((W - L - R) / 26)));
    r.laps.forEach(function (l, i) {
      path += (i ? 'L' : 'M') + x(i) + ' ' + y(l.paceSec);
      dots += '<circle cx="' + x(i) + '" cy="' + y(l.paceSec) + '" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>';
      if (i % every === 0) svg += '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle">' + l.n + '</text>';
      var inT = t ? (l.paceSec >= t.fastSec - 2 && l.paceSec <= t.slowSec + 2 ? 'v cílovém pásmu' : l.paceSec < t.fastSec ? 'rychleji než cíl' : 'pomaleji než cíl') : '';
      hits += '<rect class="hit" x="' + (L + band * i) + '" y="' + T + '" width="' + band + '" height="' + (H - T - B) + '" rx="4"' + tipAttr('<b>Kolo ' + l.n + '</b>' + pace(l.paceSec) + ' /km · ' + meters(l.distanceM) + ' za ' + dur(l.durationSec) + (l.avgHr != null ? '<br>tep ' + Math.round(l.avgHr) : '') + (inT ? '<br><span>' + inT + '</span>' : '')) + '/>';
    });
    svg += hits + '<path d="' + path + '" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>' + dots + '</svg>';
    return svg + '<div class="foot">Nahoře rychleji.' + (t && v.lapsInTarget != null ? ' V cílovém pásmu ' + v.lapsInTarget + ' z ' + n + ' kol' + (v.steady ? '.' : ', počítají se i rozklus a pauzy.') : '') + '</div>';
  }
  function pickRow(key, options, current, label) {
    return '<div class="pick" role="group" aria-label="' + esc(label) + '">' + options.map(function (o) {
      var on = Array.isArray(current) ? current.indexOf(o[0]) >= 0 : String(current) === String(o[0]);
      return '<button type="button" data-pick="' + key + '" data-val="' + esc(o[0]) + '" aria-pressed="' + on + '">' + esc(o[1]) + '</button>';
    }).join('') + '</div>';
  }
  function renderResult(d, width) {
    var r = d.run, w = d.workout, t = d.target, sc = d.score, c = d.checkin, v = d.verdict || {};
    if (!form || form.id !== w.id) form = { id: w.id, status: c.status === 'scheduled' || c.status === 'skipped' ? (sc ? sc.suggestedStatus : 'completed') : c.status, feel: c.feel, pain: c.pain || 'none', conditions: c.conditions.slice() };
    var h = head('', d) + '<div class="eyebrow">Doběhnuto</div><h2>' + esc(w.title) + ' · ' + DOW[w.dow] + ' ' + dm(w.date) + '</h2>';
    h += '<div class="sub">Plán: ' + esc(w.summary) + (r && r.name ? ' · Běh: ' + esc(r.name) : '') + '</div>';
    if (r) {
      if (sc) {
        h += '<div class="score"><div class="big">' + sc.total + ' <small>%</small></div><div><b>' + esc(sc.label) + '</b><ul>' + sc.parts.map(function (p) { return '<li>' + esc(p.label) + ': ' + esc(p.text) + '</li>'; }).join('') + '</ul></div></div>';
        h += '<div class="foot">Odhad z vzdálenosti' + (v.steady ? ' a průměrného tempa' : '') + '. Je to vodítko, ne měření kvality tréninku.</div>';
      }
      h += '<div class="tiles' + (r.avgHr == null ? '' : ' two') + '">';
      h += '<div class="tile"><div class="k">Vzdálenost</div><div class="v">' + num(Math.round(r.distanceM / 10) / 100) + ' <small>km</small></div><div class="n">plán ' + (w.kmMax ? kmRange(w.kmMin, w.kmMax) + ' km' : '–') + '</div></div>';
      h += '<div class="tile"><div class="k">Tempo</div><div class="v">' + pace(r.avgPaceSec) + ' <small>/km</small></div>' + (t && v.steady ? '<div class="n">cíl ' + pace(t.fastSec) + '–' + pace(t.slowSec) + '</div>' : '<div class="n">průměr celého běhu</div>') + '</div>';
      h += '<div class="tile"><div class="k">Čas</div><div class="v">' + dur(r.movingSec) + '</div>' + (r.elevGainM != null ? '<div class="n">+' + Math.round(r.elevGainM) + ' m</div>' : '') + '</div>';
      if (r.avgHr != null) h += '<div class="tile"><div class="k">Tep</div><div class="v">' + Math.round(r.avgHr) + ' <small>/min</small></div></div>';
      h += '</div>';
      if (r.laps.length > 1) h += '<h3>Tempo po kolech' + (t ? ' · pruh je cíl „' + esc(t.label) + '“' : '') + '</h3>' + lapChart(r, t, v, width);
    }
    h += '<div class="form"><div class="k">Stav</div>' + pickRow('status', [['completed', 'Splněno'], ['partial', 'Částečně']], form.status, 'Stav');
    h += '<div class="k">Pocit</div>' + pickRow('feel', [1, 2, 3, 4, 5].map(function (n) { return [n, n + ' · ' + FEEL[n]]; }), form.feel, 'Pocit');
    h += '<div class="k">Bolest</div>' + pickRow('pain', PAIN, form.pain, 'Bolest');
    // Okolnosti jsou sbalené, dokud žádná není vybraná: běžný zápis je pak krátký.
    var condOpen = form.showCond || form.conditions.length > 0;
    h += '<details class="cond" data-cond="1"' + (condOpen ? ' open' : '') + '><summary>Okolnosti' + (form.conditions.length ? ' (' + form.conditions.length + ')' : ': zima, vítr, spánek, alkohol…') + '</summary>' + pickRow('cond', Object.keys(d.conditionLabels).map(function (k) { return [k, d.conditionLabels[k]]; }), form.conditions, 'Okolnosti') + '</details>';
    h += '<button type="button" class="primary" data-save="1">Uložit zápis</button></div>';
    if (!r) h += '<div class="acts">' + (strava
      ? '<button type="button" data-say="' + esc('Najdi ve Stravě můj běh z ' + dm(w.date) + ' a zhodnoť ho proti jednotce ' + w.title + '.') + '">Zhodnotit podle Stravy</button>'
      : '<button type="button" data-say="' + esc('Chci zhodnotit běh z ' + dm(w.date) + ' proti jednotce ' + w.title + '. Zeptej se mě na vzdálenost, čas a případně kola.') + '">Zadat čísla běhu</button>') + '</div>';
    else h += '<div class="foot">Čísla běhu se jen vykreslila. Run Tracker je neukládá.</div>';
    if (w.lines.length) h += '<details><summary>Předpis jednotky</summary><ul class="sub">' + w.lines.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul></details>';
    return h + hints(['Co z toho plyne pro další dny?']);
  }
  function saveCheckin(d) {
    var w = d.workout, args = { workoutId: w.id, status: form.status, conditions: form.conditions.slice(), pain: form.pain };
    if (form.feel) args.feel = form.feel;
    var parts = [form.status === 'partial' ? 'splněno částečně' : 'splněno'];
    if (form.feel) parts.push('pocit ' + form.feel + ' z 5 (' + FEEL[form.feel] + ')');
    if (form.pain && form.pain !== 'none') parts.push('bolest ' + (form.pain === 'mild' ? 'mírná' : 'výrazná'));
    if (form.conditions.length) parts.push('okolnosti: ' + form.conditions.map(function (k) { return d.conditionLabels[k]; }).join(', '));
    var summary = w.title + ' (' + DOW[w.dow] + ' ' + dm(w.date) + '): ' + parts.join(', ') + '.';
    open('set_status', args, 'Zapiš jednotku ' + summary, 'zapsal jednotku ' + summary);
  }

  // ---------- Soubor do hodinek ----------
  function renderGarmin(d) {
    var w = d.workout, h = head('', d) + '<div class="eyebrow">Soubor do hodinek Garmin</div><h2>' + esc(w.title) + ' · ' + DOW[w.dow] + ' ' + dm(w.date) + '</h2>';
    h += '<div class="sub">' + d.steps.length + ' kroků' + (d.hasPaces ? ' s cílovými tempy' : '') + '</div>';
    h += '<a class="primary" data-link="1" href="' + esc(d.url) + '" target="_blank" rel="noopener">Stáhnout soubor .fit</a>';
    h += '<details><summary>Kroky a jak soubor nahrát</summary><ol class="steps fit">' + d.steps.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ol>';
    return h + '<p class="sub">Hodinky připoj kabelem k počítači a soubor zkopíruj do složky GARMIN/NewFiles. Odkaz platí 24 hodin.</p></details>';
  }

  // ---------- Vykreslení a velikost ----------
  var lastWidth = 0, lastHeight = 0;
  function render() {
    tips = []; hideTip();
    var width = app.clientWidth - 28;
    lastWidth = app.clientWidth;
    if (!data) app.innerHTML = head('', null) + '<p class="empty">' + esc(plain) + '</p>';
    else app.innerHTML = data.view === 'week' ? renderWeek(data) : data.view === 'plan' ? renderPlan(data, width) : data.view === 'paces' ? renderPaces(data) : data.view === 'result' ? renderResult(data, width) : data.view === 'garmin' ? renderGarmin(data) : data.view === 'empty' ? renderEmpty(data) : '<p class="empty">Neznámé zobrazení.</p>';
    // Ve skrytém rámu se překreslovací zpětná volání nespouštějí; hostitel, který kartu ukáže až podle výšky, by ji jinak nedostal.
    requestAnimationFrame(reportSize);
    setTimeout(reportSize, 60);
  }
  // Výška se měří z karty, ne z dokumentu: dokument nikdy neklesne pod výšku, kterou mu hostitel dal,
  // takže by po zmenšení obsahu zůstalo dole prázdné místo.
  function reportSize() {
    var h = Math.ceil(app.getBoundingClientRect().height);
    if (Math.abs(h - lastHeight) < 1) return;
    lastHeight = h;
    notify('ui/notifications/size-changed', { height: h });
    if (oai && typeof oai.notifyIntrinsicHeight === 'function') { try { oai.notifyIntrinsicHeight(h); } catch (err) { /* hostitel výšku neumí */ } }
  }
  if (window.ResizeObserver) {
    new ResizeObserver(function () { if ((data || plain) && Math.abs(app.clientWidth - lastWidth) > 4) render(); reportSize(); }).observe(document.body);
    new ResizeObserver(reportSize).observe(app);
  }
  app.addEventListener('toggle', function (e) { if (form && e.target.hasAttribute && e.target.hasAttribute('data-cond')) form.showCond = e.target.open; reportSize(); }, true);

  if (!host) { app.innerHTML = '<p class="empty">Tenhle widget se zobrazuje v konverzaci s Claude nebo ChatGPT, když je připojený konektor Run Tracker.</p>'; return; }
  if (oai) {
    applyTheme(oai.theme);
    if (oai.toolOutput && oai.toolOutput.view) showResult({ structuredContent: oai.toolOutput }, true);
    window.addEventListener('openai:set_globals', function (e) {
      var g = e.detail && e.detail.globals;
      if (!g) return;
      if (g.theme) applyTheme(g.theme);
      if (g.toolOutput && g.toolOutput.view) showResult({ structuredContent: g.toolOutput }, true);
    });
  }
  request('ui/initialize', { appInfo: { name: 'run-tracker-view', version: '0.5.0' }, appCapabilities: {}, protocolVersion: '2026-01-26' }, 10000)
    .then(function (result) { applyHost(result && result.hostContext); notify('ui/notifications/initialized'); })
    .catch(function () { notify('ui/notifications/initialized'); });
})();
</script>
</body>
</html>
